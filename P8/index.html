<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Portfolio</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section id="home" class="hero">
        <h1>Welcome to My Portfolio</h1>
        <p>Creative Web Developer</p>
    </section>

    <section id="projects" class="projects">
        <h2>My Projects</h2>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
                 alt="Laptop displaying a coding workspace">

            <div class="overlay">
                <h3>Web Development</h3>
                <p>Creative website design using HTML and CSS.</p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Me</h2>
        <p>yourname@example.com</p>
    </section>

</body>
</html>
